<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ngọc :) 🎉</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://photo-resize-zmp3.zmdcdn.me/w256_r1x1_jpeg/cover/a/7/d/f/a7df3226a8aaf23c29868d86344d618b.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      background-color: #000;
    }

    #youtube-iframe {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      border: none;
      opacity: 0;
      pointer-events: none;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(10, 10, 20, 0.65), rgba(10, 10, 20, 0.8)), 
                  url('https://png.pngtree.com/png-clipart/20241016/original/pngtree-happy-birthday-invitation-card-editable-png-image_16333319.png');
      background-size: cover;
      background-position: center;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s ease;
    }

    #start-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .start-btn {
      padding: 18px 40px;
      border: 2px solid rgba(255, 209, 220, 0.6);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffd1dc;
      box-shadow: 0 0 30px rgba(255, 209, 220, 0.3);
      animation: pulse 2s infinite;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 209, 220, 0.3); }
      50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(255, 209, 220, 0.6); }
    }

    #black-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), visibility 2s ease;
    }

    #black-overlay.show {
      opacity: 1;
      visibility: visible;
      transition: none;
    }

    .bg-wrapper {
      min-height: 100vh;
      width: 100%;
      background-image: linear-gradient(rgba(10, 10, 20, 0.65), rgba(10, 10, 20, 0.75)), 
                        url('https://cdn2.fptshop.com.vn/unsafe/hinh_nen_sinh_nhat_17_67d8b46e09.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card-container {
      max-width: 550px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(255, 182, 193, 0.2);
      text-align: center;
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      transition: opacity 2.2s cubic-bezier(0.16, 1, 0.3, 1), transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .photo-frame {
      width: 100%;
      max-width: 280px;
      height: 280px;
      margin: 0 auto 25px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #ffd1dc;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255, 209, 220, 0.6);
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 2s ease 0.4s, transform 2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
    }

    .card-container.show .title {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-container {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #f0f0f0;
      text-align: left;
      min-height: 140px;
      margin-bottom: 30px;
      white-space: pre-line;
      background: rgba(0, 0, 0, 0.25);
      padding: 20px;
      border-radius: 15px;
      border-left: 3px solid #ffd1dc;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1rem;
      background-color: #ffd1dc;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .btn-next {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #1a1a2e;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(255, 154, 158, 0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 1s ease;
    }

    .btn-next.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <iframe id="youtube-iframe" allow="autoplay"></iframe>
  <div id="start-overlay">
    <div class="start-btn">bấm vào đây để mở thiệp 💌</div>
  </div>
  <div id="black-overlay"></div>

  <div class="bg-wrapper">
    <div class="card-container" id="main-card">
      
      <div class="photo-frame">
        <img src="https://img.magnific.com/vector-cao-cap/mot-co-gai-hoat-hinh-voi-mot-chiec-banh-sinh-nhat-va-mot-chiec-banh-sinh-nhat-voi-mot-mon-qua-sinh-nhat_1087929-19117.jpg?semt=ais_hybrid&w=740&q=80" alt="Birthday Cake">
      </div>

      <h1 class="title">Happy Birthday Bích Ngọc ✨</h1>

      <div class="letter-container">
        <span id="typewriter"></span><span class="cursor" id="cursor"></span>
      </div>

      <a href="https://happybirthdayngoc.github.io/tinhcamcuatodanhchocau/" class="btn-next" id="next-btn">
        nếu cậu đã đọc đến đây rồi thì hãy thử ấn vào đây đi :)
      </a>
    </div>
  </div>

  <script>
    const letterText = `Chúc mừng sinh nhật Ngọc! 🎉🎂✨
Vậy là ngày 15/09/2011 đã trở thành một ngày đặc biệt, bởi đó là ngày một cô gái tên Tạ Bích Ngọc xuất hiện trên thế giới này :). Và hôm nay, khi cậu bước sang một tuổi mới, mình chúc cậu sẽ luôn giữ được nụ cười, sự vui vẻ và những điều tốt đẹp nhất của mình 😳
Dù cậu học 10A4 còn mình ở 10A1, mỗi người một lớp, một lịch học và có thể không phải lúc nào cũng gặp nhau 🥹, nhưng mình vẫn muốn dành cho cậu những lời chúc thật đặc biệt trong ngày hôm nay 😊. Mong rằng tuổi mới sẽ mang đến cho cậu thật nhiều niềm vui, những người bạn tốt, những kỷ niệm đáng nhớ và thật nhiều khoảnh khắc khiến cậu phải mỉm cười 😛
Chúc cậu học tập ngày càng tiến bộ, gặp nhiều may mắn trong mọi việc, luôn tự tin với những điều mình lựa chọn và đủ mạnh mẽ để vượt qua những lúc mệt mỏi hay khó khăn. Mong rằng những cố gắng của cậu sẽ luôn được đền đáp bằng những kết quả xứng đáng :)
Tuổi 15 là một chặng đường mới, chắc chắn sẽ có những ngày vui, những ngày buồn, những lúc thành công và cả những lúc chưa được như mong muốn. Nhưng dù thế nào đi nữa, mình hy vọng cậu vẫn sẽ luôn tin vào bản thân, sống thật vui, thật ý nghĩa và tạo ra thật nhiều kỷ niệm đẹp trong những năm tháng học sinh này
Chúc cậu tuổi mới: học giỏi hơn, vui vẻ hơn, may mắn hơn, hạnh phúc hơn và luôn gặp được những điều tốt đẹp 🌟
Hy vọng sinh nhật năm nay sẽ là một ngày thật đáng nhớ đối với cậu. Hãy tận hưởng ngày đặc biệt của mình, nhận thật nhiều quà 🎁, ăn thật nhiều bánh 🎂 và quan trọng nhất là cười thật nhiều nhé :)
Happy Birthday Bích Ngọc ><🎉💗

Chúc cho những điều tốt đẹp nhất sẽ đến với cậu, không chỉ trong tuổi 15 này mà còn trong thật nhiều năm về sau.
15/09/2026 — một ngày thật đặc biệt dành cho Bích Ngọc ✨
— From HoangTienMinh 10A1, gửi một lời chúc thật đẹp đến TaBichNgoc 10A4 :)`;
    const YOUTUBE_VIDEO_ID = 'Wu8NeFXaoOc'; 
    const BLACK_SCREEN_TIME = 4105;
    const TYPING_SPEED = 50;

    function startTypewriter(text, index = 0) {
      const typewriterElement = document.getElementById('typewriter');
      const nextBtn = document.getElementById('next-btn');

      if (index < text.length) {
        typewriterElement.textContent += text.charAt(index);
        setTimeout(() => startTypewriter(text, index + 1), TYPING_SPEED);
      } else {
        setTimeout(() => {
          nextBtn.classList.add('show');
        }, 500);
      }
    }

    document.getElementById('start-overlay').addEventListener('click', function() {
      const startOverlay = this;
      const blackOverlay = document.getElementById('black-overlay');
      const mainCard = document.getElementById('main-card');
      const ytIframe = document.getElementById('youtube-iframe');
      ytIframe.src = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&loop=1&playlist=${YOUTUBE_VIDEO_ID}`;

      blackOverlay.classList.add('show');
      startOverlay.classList.add('fade-out');

      setTimeout(() => {
        blackOverlay.classList.remove('show');
        mainCard.classList.add('show');
        
        setTimeout(() => {
          startTypewriter(letterText);
        }, 800);
      }, BLACK_SCREEN_TIME);
    });
  </script>
</body>
</html>
